name: Build, Push, and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/streamlit-portfolio:latest

      - name: SSH and Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker on EC2 if missing
            if ! command -v docker &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y docker.io
                sudo systemctl start docker
                sudo systemctl enable docker
                sudo usermod -aG docker $USER
            fi

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Stop and remove existing container if running
            sudo docker stop streamlit-app || true
            sudo docker rm streamlit-app || true

            # Pull latest image and run container
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/streamlit-portfolio:latest
            sudo docker run -d \
              --name streamlit-app \
              --restart unless-stopped \
              -p 80:8501 \
              ${{ secrets.DOCKERHUB_USERNAME }}/streamlit-portfolio:latest